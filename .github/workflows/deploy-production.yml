# Production deploy: started by hand only, through the protected `production` environment.
# The real gate is the environment protection set by the owner (required reviewer, deployment
# branch main only — docs/setup-cloudflare.md step 4); the checks below are extra safety.
# Gate 3 in docs/workflow.md; ADR 0012.
name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      SHA: ${{ github.sha }}
    steps:
      - name: Only main
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "::error::production deploys only from main (got $GITHUB_REF)"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Dependency-free: refuses before anything is installed.
      - name: Production preflight
        run: node scripts/production-preflight.mjs .

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID belum diisi di environment production (docs/setup-cloudflare.md bagian 5)."
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # No Cloudflare token in install, checks or build: third-party code never sees it.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Apply D1 migrations (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @pusatk3/api exec wrangler d1 migrations apply DB --env production --remote

      - name: Deploy API (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @pusatk3/api exec wrangler deploy --env production --var APP_VERSION:"$SHA"

      - name: Build web (production, indexable)
        env:
          CLOUDFLARE_ENV: production
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
        run: |
          pnpm --filter @pusatk3/web build
          name=$(jq -r .name apps/web/dist/client/wrangler.json)
          test "$name" = "pusatk3-web-production" || { echo "::error::web build targets '$name', expected pusatk3-web-production"; exit 1; }

      - name: Deploy web (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @pusatk3/web exec wrangler deploy

      - name: Smoke test
        run: |
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 10 -o health.json https://pusatk3.id/api/v1/health && grep -q "\"version\":\"$SHA\"" health.json; then
              break
            fi
            if [ "$attempt" = 18 ]; then echo "::error::health did not report version $SHA: $(cat health.json 2>/dev/null)"; exit 1; fi
            sleep 10
          done
          curl -fsS --retry 10 --retry-delay 10 --retry-max-time 180 --retry-all-errors -D headers.txt -o index.html https://pusatk3.id/
          if grep -qi '^x-robots-tag: noindex' headers.txt; then echo "::error::production homepage is noindex"; exit 1; fi
          grep -q 'PusatK3' index.html || { echo "::error::production homepage content not found"; exit 1; }
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://pusatk3.id/robots.txt | grep -qx 'Allow: /' || { echo "::error::production robots.txt must allow crawling"; exit 1; }
