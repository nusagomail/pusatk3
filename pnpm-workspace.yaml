packages:
  - apps/*
  - packages/*

# Install scripts allowed to run (pnpm 10 blocks them by default).
# esbuild and workerd download/verify their platform binary (wrangler, Workers tests).
onlyBuiltDependencies:
  - esbuild
  - workerd
# Supply-chain guard: resolve only npm releases at least 3 days old (in minutes). Compromised
# packages are usually pulled within hours or days. Staging builds run with an account-wide
# Cloudflare token in a shared account (owner decision B, ADR 0011/0015).
minimumReleaseAge: 4320
